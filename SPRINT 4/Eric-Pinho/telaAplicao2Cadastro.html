<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Tela Cadastro</title>
        <style>
            .texto-centro {
                display: flex;
                justify-content: center;
                align-items: center
        }
            .texto-centro input + label {
                margin-left: 20px; 
        }
            .input-cpfemailsenha {
                width: 47%
            }
            .input-telefone {
                width: 45%
            }
        
            .titulo-grande {
                font-size: 55px; 
        }
            
            .titulo-medio { 
                font-size: 40px;
            }
            .titulo-medio label { 
                font-size: 30px;
            }
            .titulo-medio input { 
                font-size: 20px;
            }
                
            .cor-roxa {
                color: #4A148C;
            }
            .botao-cadastro {
                font-size: 18px;  
                width: 24% ;
                height: 35px;     
                        
            }
        </style>
        </head>
    <body>
        <h1 class="cor-roxa">
            Repassa
        </h1>
        <h5 class="cor-roxa"> 
            MATERIAIS QUE CONTINUAM HISTÓRIAS
        </h5>
        <h1 class="texto-centro cor-roxa titulo-grande">
            Criar conta
        </h1>
        <div class="texto-centro titulo-medio">
            <label for="nome-usuario" class="titulo-medio cor-roxa">Nome:</label>
            <input type="text" id="nome-usuario" placeholder="Digite seu nome">
            <label for="sobrenome-usuario" class="titulo-medio cor-roxa">Sobrenome:</label>
            <input type="text" id="sobrenome-usuario" placeholder="Digite seu sobrenome">
        </div>
        <br>
        <br>
        
        <div class="texto-centro titulo-medio">
            <label for="cpf-usuario" class="titulo-medio cor-roxa">CPF:</label>
            <input type="text" id="cpf-usuario" class="input-cpfemailsenha" placeholder="XXX.XXX.XXX-XX">
        </div>
        <br>
        <br>
        
        <div class="texto-centro titulo-medio">
            <label for="telefone-usuario" class="titulo-medio cor-roxa">Telefone:</label>
            <input type="text" id="telefone-usuario" class="input-telefone" placeholder="(XX) XXXXX-XXXX">
        </div>
        <br>
        <br>
        
        <div class="texto-centro titulo-medio">
            <label for="email-usuario" class="titulo-medio cor-roxa">E-mail:</label>
            <input type="text" id="email-usuario" class="input-cpfemailsenha" placeholder="seuemail@universidade.com.br">
        </div>
        <br>
        <br>
        <div class="texto-centro titulo-medio">
            <label for="senha-usuario" class="titulo-medio cor-roxa">Senha:</label>
            <input type="text" id="senha-usuario" class="input-cpfemailsenha" placeholder="Digite sua senha">
        </div>
        <br>
        <br>
        <form action="../Lucas-Lemos/templates/index.html">
        <div class="texto-centro">
            <button type="submit" class="botao-cadastro">Cadastre-se</button>
        </div>
</form>
    </body>
</html>
