<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Tela Login</title>
        <style>
            .texto-centro {
                display: flex;
                justify-content: center;
                align-items: center
        }
            .titulo-grande {
                font-size: 55px; 
        }
            
            .titulo-medio { 
                font-size: 40px;
            }
            .titulo-medio label { 
                font-size: 30px;
            }
            .titulo-medio input { 
                font-size: 20px;
            }
                
            .cor-roxa {
                color: #4A148C;
            }
            .botao-entrar {
                font-size: 18px;  
                width: 24%      
                        
            }
        </style>
    </head>
    <body>
        <h1 class="cor-roxa texto-centro">
            Repassa
        </h1>
        <h5 class="cor-roxa texto-centro"> 
            MATERIAIS QUE CONTINUAM HISTÓRIAS
        </h5>
        <br>
        <br>
        <h1 class="texto-centro cor-roxa titulo-grande">
            Faça seu login
        </h1>
        <br>
        <br>
        <div class="texto-centro titulo-medio">
            <label for="email-usuario" class="titulo-medio cor-roxa">E-mail:</label>
            <input type="text" id="email-usuario" placeholder="seuemail@universidade.com.br">
        </div>
        <br>
        <br>
        <br>
        <div class="texto-centro titulo-medio">
            <label for="senha-usuario" class="titulo-medio cor-roxa">Senha:</label>
            <input type="senha" id="senha-usuario" placeholder="Digite sua senha:">
        </div>
        <br>
        <br>
        <br>
        <div class="texto-centro">
            <button type="submit" class="botao-entrar">Entrar</button>
        </div>
        <br>
        <h4 class="texto-centro cor-roxa" style="text-decoration: underline;">
            Esqueci minha senha
        </h4>
        <br>
        <h3 class="texto-centro">
            Ainda não tem uma conta?
        </h3>
        <h3 class="cor-roxa texto-centro" style="text-decoration: underline;">
            Criar Conta
        </h3>
    
        
    </body>
</html>
