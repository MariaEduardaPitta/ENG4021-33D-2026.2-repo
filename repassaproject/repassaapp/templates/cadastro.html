{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Tela Cadastro</title>
        <link rel="stylesheet" href="{% static 'css/cadastro.css' %}">
    </head>
    <body>
        <h1 class="cor-roxa">Repassa</h1>
        <h5 class="cor-roxa">MATERIAIS QUE CONTINUAM HISTÓRIAS</h5>
        <h1 class="texto-centro cor-roxa titulo-grande">Criar conta</h1>

        
        <form method="POST">
            {% csrf_token %}

            <div class="texto-centro titulo-medio">
                <label for="nome-usuario" class="titulo-medio cor-roxa">Nome:</label>
                <input type="text" id="nome-usuario" name="nome" placeholder="Digite seu nome">
                
                <label for="sobrenome-usuario" class="titulo-medio cor-roxa">Sobrenome:</label>
                <input type="text" id="sobrenome-usuario" name="sobrenome" placeholder="Digite seu sobrenome">
            </div>
            <br><br>
            
            <div class="texto-centro titulo-medio">
                <label for="cpf-usuario" class="titulo-medio cor-roxa">CPF:</label>
                <input type="text" id="cpf-usuario" name="cpf" class="input-cpfemailsenha" placeholder="XXX.XXX.XXX-XX">
            </div>
            <br><br>
            
            <div class="texto-centro titulo-medio">
                <label for="telefone-usuario" class="titulo-medio cor-roxa">Telefone:</label>
                <input type="text" id="telefone-usuario" name="telefone" class="input-telefone" placeholder="(XX) XXXXX-XXXX">
            </div>
            <br><br>
            
            <div class="texto-centro titulo-medio">
                <label for="email-usuario" class="titulo-medio cor-roxa">E-mail:</label>
                <input type="email" id="email-usuario" name="email" class="input-cpfemailsenha" placeholder="seuemail@universidade.com.br">
            </div>
            <br><br>
            
            <div class="texto-centro titulo-medio">
                <label for="senha-usuario" class="titulo-medio cor-roxa">Senha:</label>
                <input type="password" id="senha-usuario" name="senha" class="input-cpfemailsenha" placeholder="Digite sua senha">
            </div>
            <br><br>

            <div class="texto-centro">
                <button type="submit" class="botao-cadastro">Cadastre-se</button>
            </div>
        </form> 
    </body>
</html>
