{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Login - Repassa</title>
    <link rel="stylesheet" href="{% static 'css/loginmelhorado.css' %}">
</head>
<body>

    <div class="login-box">
        <h1 class="cor-roxa texto-centro titulo-marca">
            Repassa
        </h1>
        <h5 class="cor-subtexto texto-centro"> 
            MATERIAIS QUE CONTINUAM HISTÓRIAS
        </h5>

        <h1 class="texto-centro cor-roxa titulo-grande">
            Faça seu login
        </h1>

        <form action="../templates/index.html">
            <div class="campo-grupo">
                <label for="email-usuario" class="cor-roxa">E-mail:</label>
                <input type="text" id="email-usuario" placeholder="seuemail@universidade.com.br">
            </div>

            <div class="campo-grupo">
                <label for="senha-usuario" class="cor-roxa">Senha:</label>
                <input type="password" id="senha-usuario" placeholder="Digite sua senha">
            </div>

            <div class="texto-centro">
                <button type="submit" class="botao-entrar">Entrar</button>
            </div>
        </form>

        <div class="links-uteis">
            <h4 class="texto-centro link-esqueci">
                Esqueci minha senha
            </h4>
            
            <div class="bloco-cadastro">
                <h3>Ainda não tem uma conta?</h3>
                <a href="telaAplicao2Cadastro.html" class="cor-roxa link-cadastro">Criar Conta</a>
            </div>
        </div>
    </div>

</body>
</html>
