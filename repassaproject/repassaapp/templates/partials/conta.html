<div class="conta">
    {% if user.is_authenticated %}
      <a href="/notificacoes/" aria-label="Notificações">🔔 {% if nao_lidas %}<span class="contador">{{ nao_lidas }}</span>{% endif %}</a>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Sair</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}" class="botao">Entrar</a>
    {% endif %}
</div>
