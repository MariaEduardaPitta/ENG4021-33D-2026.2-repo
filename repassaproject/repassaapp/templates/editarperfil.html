{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Repassa</title>
    <link rel="stylesheet" href="{% static 'css/editarperfil.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsivo.css' %}">
</head>
<body data-tela="editarperfil">

    <div class="perfil-box">
        <h1 class="cor-roxa texto-centro titulo-marca">
            Repassa
        </h1>
        <h5 class="cor-subtexto texto-centro"> 
            MATERIAIS QUE CONTINUAM HISTÓRIAS
        </h5>

        <h1 class="texto-centro cor-roxa titulo-grande">
            Editar Perfil
        </h1>

        
        {% if sucesso %}<p role="status">Perfil atualizado.</p>{% endif %}
        <form method="POST">
            {% csrf_token %}
            {{ form.errors }}

            <div class="linha-dupla">
                <div class="campo-grupo">
                    <label for="nome-usuario" class="cor-roxa">Nome:</label>
                    <input type="text" id="nome-usuario" name="nome" placeholder="Seu nome" required value="{{ form.nome.value|default_if_none:'' }}">
                </div>

                <div class="campo-grupo">
                    <label for="sobrenome-usuario" class="cor-roxa">Sobrenome:</label>
                    <input type="text" id="sobrenome-usuario" name="sobrenome" placeholder="Seu sobrenome" required value="{{ form.sobrenome.value|default_if_none:'' }}">
                </div>
            </div>

            <div class="campo-grupo">
                <label for="email-usuario" class="cor-roxa">E-mail:</label>
                <input type="email" id="email-usuario" name="email" class="input-destaque" placeholder="seuemail@universidade.com.br" required value="{{ form.email.value|default_if_none:'' }}">
            </div>

            <div class="campo-grupo">
                <label for="telefone-usuario" class="cor-roxa">Telefone:</label>
                <input type="text" id="telefone-usuario" name="telefone" class="input-destaque" placeholder="(XX) XXXXX-XXXX" value="{{ form.telefone.value|default_if_none:'' }}">
            </div>

            <div class="campo-grupo">
                <label for="senha-atual" class="cor-roxa">Nova Senha (deixe em branco para não alterar):</label>
                <input type="password" id="senha-atual" name="senha" class="input-destaque" placeholder="Digite a nova senha">
            </div>

            <div class="texto-centro botoes-grupo">
                <button type="submit" class="botao-salvar">Salvar Alterações</button>
            </div>
        </form>

        <div class="links-uteis texto-centro">
            <a href="{% url 'login' %}" class="link-cancelar">Cancelar e Voltar</a>
        </div>
    </div>

</body>
</html>
