
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anunciar Material - Repassa</title>
    <link rel="stylesheet" href="anunciar.css">
</head>
<body>
    <header class="cabecalho">
        <div class="logo">
            <img src="logo.png.png" alt="Repassa">
        </div>
        <nav class="menu">
            <a href="#">⌂ Início</a>
            <a href="#">⌕ Buscar</a>
            <a href="#" class="ativo">⊕ Anunciar</a>
            <a href="#">♧ Conversas</a>
            <a href="#">♙ Perfil</a>
        </nav>
    </header>

    <main class="pagina">
        <p class="subtitulo">Divulgue seu material</p>
        <h1>Anunciar material</h1>
        <p class="descricao">Preencha as informações abaixo para publicar seu anúncio na comunidade universitária.</p>

        <form class="formulario">
            <div class="campo">
                <label for="foto">Foto do material</label>
                <label for="foto" class="area-foto">
                    <span class="icone-foto">▧+</span>
                    <span>Adicionar foto</span>
                </label>
                <input type="file" id="foto" accept="image/*" hidden>
            </div>

            <div class="campo">
                <label for="titulo">Título do anúncio</label>
                <input type="text" id="titulo" placeholder="Ex.: Calculadora científica" required>
            </div>

            <div class="campo">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" placeholder="Conte o estado de uso, motivo da venda e o que acompanha..." required></textarea>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <option value="">Selecione</option>
                        <option>Livro</option>
                        <option>Calculadora</option>
                        <option>Jaleco</option>
                        <option>Instrumento</option>
                        <option>Apostila</option>
                        <option>Outro</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="curso">Curso</label>
                    <select id="curso" required>
                        <option value="">Selecione</option>
                        <option>Administração</option>
                        <option>Direito</option>
                        <option>Engenharia</option>
                        <option>Medicina</option>
                        <option>Psicologia</option>
                        <option>Outro</option>
                    </select>
                </div>
            </div>

            <div class="campo">
                <label for="estado">Estado de conservação</label>
                <select id="estado" required>
                    <option value="">Selecione</option>
                    <option>Novo</option>
                    <option>Seminovo</option>
                    <option>Usado</option>
                </select>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="preco">Preço de venda (R$)</label>
                    <input type="number" id="preco" min="0" step="0.01" placeholder="0,00" required>
                </div>
                <div class="campo">
                    <label for="preco-novo">Preço do produto novo (R$)</label>
                    <input type="number" id="preco-novo" min="0" step="0.01" placeholder="0,00">
                    <small>Usado para exibir o desconto riscado no anúncio.</small>
                </div>
            </div>

            <button type="submit">Publicar anúncio</button>
        </form>
    </main>
</body>
</html>
